[package]
name = "pastahandler"
version = "0.1.0"
edition = "2024"
description = "Windows tray utility: global hotkeys load your snippets onto the clipboard — you paste with Ctrl+V"
repository = "https://github.com/Kwuasimoto/PastaHandler"
license = "MIT"
readme = "README.md"
authors = ["Kwuasimoto"]

[profile.release]
strip = true

[build-dependencies]
winresource = "0.1"   # embeds assets/icon.ico into the exe

[dependencies]
global-hotkey = "0.8"   # Win32 RegisterHotKey — narrow; OS delivers only YOUR combos
tray-icon     = "0.24"  # tray + menu (muda); sibling crate of global-hotkey
arboard       = "3.6"   # clipboard; on Windows, contents outlive your process
tao           = "0.36"  # the resident process's Win32 event loop
eframe        = "0.36"  # settings process ONLY
egui_extras   = { version = "0.36", features = ["svg", "image", "file"] }  # SVG icons + file-loaded PNG/JPG backgrounds
serde         = { version = "1.0.228", features = ["derive"] }
image         = "0.25.9"
toml          = "1.1"
rfd           = "0.17.2" # native file picker for the background image

